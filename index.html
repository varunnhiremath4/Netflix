<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg">
      <div class="box">
        <header>
          <nav class="navbar">
            <img
              class="logo"
              height="40px"
              src="assets/images/logo.svg"
              alt=""
            />
            <div class="buttons">
              <button class="button1">Language</button>
              <button class="button2">Sign In</button>
            </div>
          </nav>
          <div class="content1">
            <h1 class="first">Unlimited movies, shows, and more</h1>
            <h2 class="second">Starts at ₹149. Cancel at any time.</h2>
            <h4 class="third">
              Ready to watch? Enter your email to create or restart your
              membership.
            </h4>
          </div>
          <div class="login">
            <input
              class="emailbox"
              type="email"
              name="email"
              placeholder="Enter your email"
            />
            <button class="getstart">Get Started</button>
          </div>
        </header>
        <div class="curve"></div>
      </div>
    </div>
    <div class="trenddiv">
      <div class="trendtitle">Treanding Now</div>
    </div>
    <main>
      <div class="trendsec">
        <div class="movie"><img src="assets/images/1.png" alt=""></div>
        <div class="movie"><img src="assets/images/2.png" alt=""></div>
        <div class="movie"><img src="assets/images/3.png" alt=""></div>
        <div class="movie"><img src="assets/images/4.png" alt=""></div>
        <div class="movie"><img src="assets/images/5.png" alt=""></div>
        <div class="movie"><img src="assets/images/6.png" alt=""></div>
        <div class="movie"><img src="assets/images/7.png" alt=""></div>
        <div class="movie"><img src="assets/images/8.png" alt=""></div>
        <div class="movie"><img src="assets/images/9.png" alt=""></div>
        <div class="movie"><img src="assets/images/10.png" alt=""></div>
        
      </div>
    </main>
  </body>
</html>
